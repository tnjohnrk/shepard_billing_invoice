appId: com.shepherdenterprises.billing
productName: Shepherd Enterprises Billing System
copyright: Copyright © 2026 Shepherd Enterprises Private Limited

directories:
  output: dist_electron
  buildResources: assets

files:
  - src/main/**/*
  - dist/renderer/**/*
  - package.json
  - node_modules/**/*

win:
  target:
    - nsis
    - portable
  icon: assets/icons/app-icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shepherd Invoice Billing

publish:
  provider: github
  owner: shepherd-enterprises
  repo: shepherd-invoice
