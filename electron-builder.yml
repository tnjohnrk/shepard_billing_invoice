appId: com.shepherdenterprises.billing
productName: Shepherd Enterprises Billing System
copyright: Copyright © 2026 Shepherd Enterprises Private Limited | Powered by Vibe2Code

directories:
  output: dist_electron
  buildResources: build

files:
  - src/main/**/*
  - src/shared/**/*
  - dist/renderer/**/*
  - package.json
  - node_modules/**/*

win:
  signAndEditExecutable: false
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: src/renderer/assets/billing_image.png

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerSidebar: src/renderer/assets/billing_image.png
  uninstallerSidebar: src/renderer/assets/billing_image.png
  installerHeader: src/renderer/assets/billing_image.png
  installerHeaderIcon: src/renderer/assets/billing_image.png
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shepherd Invoice Billing
  license: installer/INSTALL_INSTRUCTIONS.txt
  include: installer/installer.nsh
  runAfterFinish: true

publish:
  provider: github
  owner: shepherd-enterprises
  repo: shepherd-invoice
